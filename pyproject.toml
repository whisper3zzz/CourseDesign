[project]
name = "course-design-face-recognition"
version = "0.1.0"
description = "PyQt5 face recognition course design project based on OpenCV, MediaPipe, and optional MindSpore components."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.26,<2",
    "opencv-contrib-python>=4.10",
    "pillow>=10.0",
    "PyQt5>=5.15.10",
    "requests>=2.32",
    "requests-toolbelt>=1.0.0",
]

[project.optional-dependencies]
mindspore = [
    "mindspore",
    "pyyaml",
]

server = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.9",
    "torch>=2.2,<2.3",
    "torchvision>=0.17,<0.18",
    "facenet-pytorch==2.6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]
